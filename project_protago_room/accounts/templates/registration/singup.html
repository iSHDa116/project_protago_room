{% extends "base_login.html" %}
{% block title %}新規登録{% endblock title %}

{% block content %}
    <div class="border border-success border-3 bg-light rounded-5 p-5 mx-auto my-5" style="max-width: 540px">
        <h3 class="text-success mb-3 text-center">ログインフォーム</h3>
        <form action="" method="post">{% csrf_token %}
            <div class="mb-3">
                <label for="id_username">ユーザー名：</label>
                <input type="text" name="id_username" id="id_username" class="form-control">
            </div>
            <div class="mb-3">
                <label for="password">パスワード：</label>
                <input type="password" name="password" id="password" required class="form-control">
            </div>
            <div class="mb-3">
                <label for="password2">確認用：</label>
                <input type="password" name="password2" id="password2" required class="form-control">
            </div>
            <div class="mb3 text-center">
                <a href="{% url "login" %}" class="text-primary">既にアカウントをお持ちの方</a>
                <br>
                <button type="submit" class="btn btn-success">ログイン</button>
            </div>
        </form>
    </div>
{% endblock content %}
